<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whyagent report</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1d21; --muted: #6b7079; --line: #e3e3df;
  --pass: #1f8a4c; --pass-bg: #e6f4ec; --fail: #c4352b; --fail-bg: #fbe9e7;
  --other: #9a6b00; --other-bg: #fbf1d9; --accent: #3b5bdb; --accent-bg: #e8edfd;
  --code-bg: #f1f1ee; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316; --panel: #1b1d21; --ink: #e8e8e6; --muted: #9196a0; --line: #2c2f35;
    --pass: #4cc483; --pass-bg: #173323; --fail: #f0685c; --fail-bg: #3a1c19;
    --other: #e0b04a; --other-bg: #352a12; --accent: #7d97f5; --accent-bg: #1f2747; --code-bg: #15171a;
  }
}
:root[data-theme="dark"] {
  --bg: #121316; --panel: #1b1d21; --ink: #e8e8e6; --muted: #9196a0; --line: #2c2f35;
  --pass: #4cc483; --pass-bg: #173323; --fail: #f0685c; --fail-bg: #3a1c19;
  --other: #e0b04a; --other-bg: #352a12; --accent: #7d97f5; --accent-bg: #1f2747; --code-bg: #15171a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
main { overflow-wrap: anywhere; max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
code, pre, .mono { font-family: var(--mono); font-size: 13px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.banner { background: var(--other-bg); color: var(--other); border-radius: 8px; padding: 8px 12px;
  margin-bottom: 16px; font-size: 14px; }

/* Section headings: a numbered question the section answers */
.sec { margin: 44px 0 14px; display: flex; gap: 12px; align-items: baseline; }
.sec .n { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px; flex: none; }
.sec h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.sec p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-weight: 400; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; }
.meta code { color: var(--ink); }

.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  font-family: var(--mono); white-space: nowrap; }
.PASS { color: var(--pass); background: var(--pass-bg); }
.TARGET_FAIL, .FAIL, .TAMPERED, .REGRESSED { color: var(--fail); background: var(--fail-bg); }
.OTHER { color: var(--other); background: var(--other-bg); }
.INFO { color: var(--accent); background: var(--accent-bg); }
.label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }

/* Hero */
.hero { margin-top: 20px; }
.hero h1 { font-size: 30px; line-height: 1.2; margin: 2px 0 8px; letter-spacing: -.02em; }
.hero h1 code { word-break: break-word; font-size: .8em; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.hero h1 .bad { color: var(--fail); }
.chain { margin-top: 20px; display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr); align-items: stretch; }
.link { min-width: 0; border-radius: 10px; padding: 12px; background: var(--bg); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px; }
.link .label { margin: 0; display: flex; gap: 6px; align-items: center; }
.link .label b { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center;
  background: var(--ink); color: var(--panel); font-size: 11px; letter-spacing: 0; }
.link.decide { background: var(--accent-bg); border-color: transparent; }
.link.broke { background: var(--fail-bg); border-color: transparent; }
.link.broke .label b { background: var(--fail); color: #fff; }
.link pre, .link .q { font-size: 12.5px; max-height: 150px; overflow: auto; }
.link .q { font-style: italic; font-size: 14px; }
.link .err { color: var(--fail); font-weight: 600; font-family: var(--mono); font-size: 12.5px; word-break: break-word; }
.arrow { display: grid; place-items: center; color: var(--muted); font-size: 18px; }
.mini-diff { font-family: var(--mono); font-size: 12px; border-radius: 6px; overflow: auto; max-height: 150px; }
.mini-diff div { white-space: pre; padding: 0 6px; }

/* Blame comparison */
.vs { margin-top: 16px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.vs .side { border-radius: 10px; padding: 14px 16px; border: 2px solid; }
.vs .wrong { border-color: var(--other); border-style: dashed; }
.vs .right { border-color: var(--pass); }
.vs .who { font-size: 13px; color: var(--muted); }
.vs .what { font-size: 17px; font-weight: 600; margin: 2px 0 6px; }
.vs .mark { float: right; font-size: 22px; font-weight: 700; line-height: 1; }
.vs .wrong .mark { color: var(--other); } .vs .right .mark { color: var(--pass); }

/* Proof experiments */
.exps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.exp { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.exp .q { font-weight: 600; }
.exp .state { display: flex; gap: 3px; flex-wrap: wrap; }
.exp .state i { width: 12px; height: 18px; border-radius: 3px; background: var(--line); }
.exp .state i.c { background: var(--fail); }
.exp .state i.gone { background: transparent; border: 1.5px dashed var(--fail); }
.exp .res { display: flex; align-items: center; gap: 10px; margin-top: auto; }
.exp .res .big { font-size: 22px; font-weight: 700; font-family: var(--mono); }
.exp .res .big.PASS, .exp .res .big.TARGET_FAIL, .exp .res .big.OTHER { background: none; }
.exp .ok { margin-left: auto; font-size: 12px; color: var(--muted); }
.exp.missing { opacity: .55; }

/* Timeline */
.strip-wrap { overflow-x: auto; padding: 12px 0 6px; }
.strip { display: grid; gap: 4px; min-width: max-content; }
.cell { position: relative; width: 56px; height: 60px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; padding: 6px 5px; text-align: left; color: var(--ink);
  font: inherit; display: flex; flex-direction: column; justify-content: space-between; }
.cell:hover { border-color: var(--muted); }
.cell .num { font-weight: 700; font-size: 13px; }
.cell .file { font-family: var(--mono); font-size: 10px; color: var(--muted); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.cell.testedit { opacity: .55; border-style: dotted; }
.cell.pruned { opacity: .4; background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); }
.cell.cause { border: 2px solid var(--fail); background: var(--fail-bg); }
.cell.blame { border: 2px dashed var(--other); }
.cell.collateral { border: 2px solid var(--other); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell .tag { position: absolute; top: -9px; right: 4px; font-size: 10px; font-weight: 700;
  padding: 0 5px; border-radius: 4px; }
.cell.cause .tag { background: var(--fail); color: #fff; }
.cell.blame .tag { background: var(--other); color: #fff; }
.band { height: 8px; border-radius: 2px; }
.band.p { background: var(--pass); opacity: .75; } .band.f { background: var(--fail); opacity: .75; }
.band.first { border-radius: 4px 2px 2px 4px; } .band.last { border-radius: 2px 4px 4px 2px; }
.probe { height: 22px; display: flex; align-items: center; justify-content: center; }
.probe .chip { font-size: 10px; padding: 0 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

.detail { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.detail-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.detail-head h3 { margin: 0; font-size: 17px; }
.quote { border-left: 3px solid var(--accent); padding: 6px 12px; background: var(--accent-bg); border-radius: 0 8px 8px 0; font-style: italic; }
.trigger { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; max-height: 220px; overflow: auto; }
.diff { background: var(--code-bg); border-radius: 8px; padding: 8px 0; overflow: auto; max-height: 340px; }
.diff div { padding: 0 12px; white-space: pre; font-family: var(--mono); font-size: 13px; }
.del { background: var(--fail-bg); color: var(--fail); }
.add { background: var(--pass-bg); color: var(--pass); }
.two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; }

/* Funnel */
.funnel { display: grid; gap: 8px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; align-items: center; }
.frow .bar { height: 30px; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 700;
  display: flex; align-items: center; padding: 0 10px; min-width: 38px; font-family: var(--mono); font-size: 14px; }
.frow.cut .bar { background: var(--line); color: var(--muted); }
.frow.final .bar { background: var(--fail); }
.frow .txt { font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
.tile { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.tile .k { font-size: 13px; color: var(--muted); }

/* Lesson */
.lesson { font-size: 20px; font-weight: 600; margin: 2px 0 18px; line-height: 1.35; }
.ab { display: grid; grid-template-columns: minmax(0,1fr) 40px minmax(0,1fr); gap: 0; align-items: stretch; }
.arm { border-radius: 10px; padding: 14px 16px; background: var(--bg); }
.arm.with { background: var(--pass-bg); }
.arm .k { font-size: 13px; color: var(--muted); }
.arm .v { font-size: 28px; font-weight: 700; margin: 2px 0 8px; }
.pips { display: flex; flex-wrap: wrap; gap: 5px; }
.pip { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.pip.PASS { background: var(--pass); color: #fff; }
.pip.FAIL, .pip.TARGET_FAIL { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail); }
.pip.TAMPERED, .pip.REGRESSED { background: var(--fail-bg); color: var(--fail); border: 1px dashed var(--fail); }
.pip.OTHER { background: var(--other-bg); color: var(--other); }
.verdict-row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.verdict-row .chip { font-size: 13px; padding: 3px 10px; }
.verdict-row .say { font-weight: 600; }
.foot { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }

/* Technical details */
details.tech { margin-top: 44px; }
details.tech > summary { cursor: pointer; font-weight: 600; font-size: 15px; padding: 12px 0; color: var(--muted); }
details.tech > summary:hover { color: var(--ink); }
.pipeline { list-style: none; margin: 0; padding: 0; }
.pipeline li { display: grid; grid-template-columns: 18px 92px 1fr; gap: 10px; padding: 7px 0;
  border-bottom: 1px solid var(--line); align-items: baseline; font-size: 14px; }
.pipeline li:last-child { border-bottom: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.done { background: var(--pass); } .dot.warn { background: var(--other); }
.dot.todo { border: 1.5px solid var(--line); }
.stage { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.pipeline li.todo .msg { color: var(--muted); }
.bars { display: grid; gap: 6px; }
.hbar { display: grid; grid-template-columns: 130px 1fr 36px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); }
td.num { text-align: right; font-family: var(--mono); }
details.runs summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 14px; }
.notes { margin: 0; padding-left: 18px; font-size: 14px; }
.stack { display: grid; gap: 14px; }

@media (max-width: 820px) {
  .chain { grid-template-columns: minmax(0,1fr); }
  .chain .arrow { height: 24px; transform: rotate(90deg); }
  .vs, .exps, .two, .ab, .tiles { grid-template-columns: minmax(0,1fr); }
  .ab .arrow { height: 28px; transform: rotate(90deg); }
  .frow { grid-template-columns: 1fr; gap: 4px; }
  .pipeline li { grid-template-columns: 18px 1fr; }
  .pipeline .msg { grid-column: 2; }
  .hero h1 { font-size: 23px; }
}
</style>
</head>
<body>
<main id="app"></main>
<script id="whyagent-data" type="application/json">/*__WHYAGENT_DATA__*/null</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("whyagent-data").textContent) || {};
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = s => s ? String(s).slice(0, 7) : "?";
const chip = (o, txt) => `<span class="chip ${esc(o)}">${esc(txt ?? (o === "TARGET_FAIL" ? "FAIL" : o))}</span>`;
const m = D.meta || {}, pre = D.precheck, cm = D.commit, ses = D.session, bh = D.blame_hint,
      pr = D.pruning, bi = D.bisect, cf = D.confirm, rc = D.root_cause, ls = D.lesson, rr = D.rerun;
const steps = (ses && ses.steps) || [];
const byId = Object.fromEntries(steps.map(s => [s.id, s]));
const cause = rc && byId[rc.step_id];
const loc = s => s ? `${s.file}${s.line ? ":" + s.line : ""}` : "";
const testName = (m.test || "").split(/\s+/).find(w => w.includes("::")) || m.test || "the test";
const testShort = testName.split("::").pop();
const runs = D.runs || [];
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
let secN = 0;
const sec = (title, sub) => { const n = ++secN; return  `<div class="sec"><span class="n">${n}</span><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div></div>`; };
function count(a) { return a.filter(x => x === "PASS").length; }
function valid(a) { return a.filter(x => x !== "OTHER").length; }
function fmtP(p) { return p == null ? "?" : p < 0.001 ? p.toExponential(1) : p.toFixed(3); }
const linesOf = t => t ? String(t).replace(/\n$/, "").split("\n") : [];  // no phantom line from a trailing newline
function diffLines(a, b) {
  return linesOf(a).map(l => `<div class="del">- ${esc(l)}</div>`).join("") + linesOf(b).map(l => `<div class="add">+ ${esc(l)}</div>`).join("");
}
// The one line of test output a human would read first: pytest's "E  ..." line, else the last error-looking line
function errorLine(out) {
  const ls = linesOf(out).map(l => l.trimEnd()).filter(Boolean);
  const e = ls.find(l => /^E\s{2,}/.test(l));
  const hit = e ? e.replace(/^E\s+/, "") : [...ls].reverse().find(l => /(Error|Exception|assert|FAILED)/.test(l)) || ls[ls.length - 1] || "";
  return hit.length > 220 ? hit.slice(0, 217) + "…" : hit;
}
const tail = (t, n) => { const l = linesOf(t); return (l.length > n ? "…\n" : "") + l.slice(-n).join("\n"); };

// ---- Facts shared by several sections ----
const pAfter = bi && bi.probes && bi.probes.find(p => p.after_step === (rc && rc.step_id));
const idx = cause ? steps.indexOf(cause) : -1;
// the edit right before the cause *in the bisected order* (bi.kept skips pruned and test-file edits)
const keptIds = bi && bi.kept ? bi.kept : null;
const prevKept = !cause ? null : keptIds
  ? (keptIds.indexOf(cause.id) > 0 ? byId[keptIds[keptIds.indexOf(cause.id) - 1]] : null)
  : (idx > 0 ? steps.slice(0, idx).filter(s => !s.test && !(pr && (pr.pruned || []).includes(s.id))).pop() : null);
// P(0) is the guilty commit's parent; the pipeline tests it explicitly (after_step 0), else Stage 1 showed it passes
const p0 = bi && bi.probes && bi.probes.find(p => p.after_step === 0);
const pBefore = !cause ? null : !prevKept ? (p0 || {outcome: "PASS", inferred: true}) : bi && bi.probes && bi.probes.find(p => p.after_step === prevKept.id);
const hintRight = (bh && bh.is_cause) || (bi && bi.via === "blame_hint");

let html = "";
if (m.sample) html += `<div class="banner">Sample data for layout. This report was not produced by a real run.</div>`;

// ---- Header ----
html += `<header><div class="brand">whyagent <span>report</span></div>
  <div class="meta"><span>test <code>${esc(m.test)}</code></span>
  ${m.good || m.head ? `<span>range <code>${short(m.good)}..${short(m.head)}</code></span>` : ""}
  ${m.repo ? `<span>repo <code>${esc(m.repo)}</code></span>` : ""}
  ${m.generated_at ? `<span>${esc(m.generated_at.replace("T", " "))}</span>` : ""}</div></header>`;

// ---- 1. The answer ----
let headline, sub = "";
if (cause) {
  headline = `The agent's edit #${cause.id} to <code>${esc(cause.file)}</code> <span class="bad">broke</span> <code>${esc(testShort)}</code>`;
  sub = [ses.agent && esc(ses.agent), ses.id && `session <code>${esc(String(ses.id).slice(0, 8))}</code>`, cm && `commit <code>${short(cm.sha)}</code>`, cause.line && `line ${esc(cause.line)}`].filter(Boolean).join(" · ");
} else if (cm && cm.human) {
  headline = `Commit <code>${short(cm.sha)}</code> broke it, and a human wrote it`;
  sub = "No Entire checkpoint on that commit, so there's no agent session to analyze.";
} else if (cm) {
  headline = `Commit <code>${short(cm.sha)}</code> broke <code>${esc(testShort)}</code>`;
  sub = "Edit-level analysis hasn't run yet.";
} else if (pre) {
  headline = "Analysis stopped at the precheck";
  sub = `HEAD failed ${pre.head_fail}/${pre.n} runs and the good commit passed ${pre.good_pass}/${pre.n}. See technical details below.`;
} else { headline = "No results yet"; }

let chain = "";
if (cause) {
  const saw = cause.trigger
    ? `<pre>${esc(tail(cause.trigger, 7))}</pre>`
    : ses.prompt ? `<div class="small">No tool output right before this edit. Its task was:</div><div class="q">“${esc(ses.prompt)}”</div>` : `<div class="muted small">Nothing recorded.</div>`;
  const decided = cause.reasoning ? `<div class="q">“${esc(cause.reasoning)}”</div>` : `<div class="muted small">Reasoning not recorded (hidden thinking).</div>`;
  const changed = `<div class="small mono muted">${esc(loc(cause))}</div><div class="mini-diff">${diffLines(cause.old_text, cause.new_text)}</div>`;
  const err = rc.failing_output ? errorLine(rc.failing_output) : "";
  const broke = `<div class="small"><code>${esc(testShort)}</code> now fails</div>${err ? `<div class="err">${esc(err)}</div>` : ""}`;
  const arrow = `<div class="arrow">→</div>`;
  chain = `<div class="chain">
    <div class="link"><div class="label"><b>1</b>What the agent saw</div>${saw}</div>${arrow}
    <div class="link decide"><div class="label"><b>2</b>What it decided</div>${decided}</div>${arrow}
    <div class="link"><div class="label"><b>3</b>What it changed</div>${changed}</div>${arrow}
    <div class="link broke"><div class="label"><b>4</b>What broke</div>${broke}</div></div>`;
}

let vs = "";
if (bh && cause) {
  const ids = bh.step_ids.map(i => "#" + i).join(", ");
  vs = bh.is_cause
    ? `<div class="vs"><div class="side right" style="grid-column:1/-1"><span class="mark">✓</span><div class="who">git blame on <code>${esc(bh.line)}</code></div>
        <div class="what">Pointed at edit ${ids}, and it was right</div><div class="small muted">Undoing it makes the test pass, so no search was needed.</div></div></div>`
    : `<div class="vs">
      <div class="side wrong"><span class="mark">✗</span><div class="who">git blame on <code>${esc(bh.line)}</code> says</div>
        <div class="what">Edit ${ids} in <code>${esc((byId[bh.step_ids[0]] || {}).file || "")}</code></div>
        <div class="small muted">That's who last touched the line. But with ${bh.step_ids.length > 1 ? "them" : "it"} undone, the test <b>still fails</b>.</div></div>
      <div class="side right"><span class="mark">✓</span><div class="who">whyagent says</div>
        <div class="what">Edit #${cause.id} in <code>${esc(cause.file)}</code></div>
        <div class="small muted">With only this edit undone, the test <b>passes</b>.</div></div></div>`;
}
html += `<section class="hero panel"><div class="label">Root cause</div><h1>${headline}</h1><div class="muted">${sub}</div>${chain}${vs}</section>`;

// ---- 2. How we know ----
if (cause) {
  const flaky = pre && pre.mode === "flaky";
  const nShow = Math.min(steps.length, 14), cPos = Math.min(idx, nShow - 1);
  const state = mode => Array.from({length: nShow}, (_, i) =>
    i === cPos ? (mode === "after" ? `<i class="c"></i>` : mode === "undo" ? `<i class="gone"></i>` : "")
    : mode === "before" && i > cPos ? "" : `<i></i>`).join("");
  const exp = (q, mode, desc, o, expect) => {
    const ok = o && o.outcome === expect;
    return `<div class="exp${o ? "" : " missing"}"><div class="q">${q}</div><div class="state" title="each block is one edit; red is #${cause.id}">${state(mode)}</div>
      <div class="small muted">${desc}</div>
      <div class="res">${o ? `<span class="big chip ${esc(o.outcome)}">${o.outcome === "TARGET_FAIL" ? "FAILS" : o.outcome === "PASS" ? "PASSES" : esc(o.outcome)}</span>` : `<span class="muted">not run</span>`}
      ${o ? `<span class="ok">${ok ? "✓ as expected" : "✗ unexpected"}</span>` : ""}</div></div>`;
  };
  html += sec("How we know", `Real test runs, not an AI's opinion. ${flaky ? `The test is flaky (fails ~${Math.round((pre.fail_rate || 0) * 100)}% of runs), so each state ran up to ${pre.runs_per_state || "several"} times.` : "Each result below is an actual run of the test."}`);
  html += `<div class="exps">
    ${exp(`Just before edit #${cause.id}`, "before", pBefore && pBefore.inferred ? "The commit's parent, checked earlier." : `The agent's edits up to ${prevKept ? "#" + prevKept.id : "this point"}.`, pBefore, "PASS")}
    ${exp(`Just after edit #${cause.id}`, "after", `Same code plus this one edit.`, pAfter, "TARGET_FAIL")}
    ${exp(`Everything except edit #${cause.id}`, "undo", `The final code with only this edit undone.`, cf, "PASS")}
  </div>`;
}

// ---- Session timeline ----
if (steps.length) {
  const pruned = new Set((pr && pr.verified && pr.pruned) || []);
  const blameIds = new Set((bh && bh.step_ids) || []);
  const collat = new Set((cf && cf.collateral) || []);
  const probes = Object.fromEntries(((bi && bi.probes) || []).map(p => [p.after_step, p.outcome]));
  const cols = `repeat(${steps.length + 1}, 56px)`;
  let cells = `<div class="cell" style="cursor:default;opacity:.8" title="Base: the guilty commit's parent"><span class="num">base</span><span class="file">${short(cm && cm.sha)}^</span></div>`;
  const bandCls = i => idx < 0 ? "" : i <= idx ? "p" : "f";  // i is the column: 0 = base, k = after steps[k-1]
  let band = idx >= 0 ? `<div class="band p first"></div>` : "";
  let probeRow = `<div class="probe">${probes[0] ? chip(probes[0]) : cm ? chip("PASS") : ""}</div>`;
  steps.forEach((s, k) => {
    const isCause = rc && s.id === rc.step_id;
    const cls = ["cell", s.test && "testedit", pruned.has(s.id) && "pruned", isCause && "cause", blameIds.has(s.id) && !isCause && "blame", collat.has(s.id) && "collateral"].filter(Boolean).join(" ");
    const tag = isCause ? "CAUSE" : blameIds.has(s.id) ? "BLAME" : "";
    cells += `<button class="${cls}" data-id="${s.id}" title="${esc(loc(s))}">${tag ? `<span class="tag">${tag}</span>` : ""}<span class="num">#${s.id}</span><span class="file">${esc(s.file.split("/").pop())}</span></button>`;
    if (idx >= 0) band += `<div class="band ${bandCls(k + 1)}${k === steps.length - 1 ? " last" : ""}"></div>`;
    probeRow += `<div class="probe">${probes[s.id] ? chip(probes[s.id]) : ""}</div>`;
  });
  html += sec("The whole session", `${plural(steps.length, "edit")} by ${esc(ses.agent || "the agent")}, in order. ${idx >= 0 ? "The bar shows when the test passes (green) and fails (red); chips mark the states we actually ran." : ""} Click an edit to see what the agent was thinking.`);
  html += `<div class="panel">
    ${ses.prompt ? `<div class="label">The task it was given</div><div style="margin-bottom:6px">“${esc(ses.prompt)}”</div>` : ""}
    <div class="strip-wrap"><div class="strip" style="grid-template-columns:${cols}">${cells}${band}${probeRow}</div></div>
    <div class="legend"><span><i style="border:2px solid var(--fail);background:var(--fail-bg)"></i>root cause</span>
      ${blameIds.size ? `<span><i style="border:2px dashed var(--other)"></i>git blame's pick</span>` : ""}
      ${pruned.size ? `<span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--muted) 3px 4px);opacity:.5"></i>can't affect the test (skipped)</span>` : ""}
      ${collat.size ? `<span><i style="border:2px solid var(--other)"></i>collateral</span>` : ""}
      ${steps.some(s => s.test) ? `<span><i style="border:1px dotted var(--muted);opacity:.6"></i>edit to a test file (tests are held fixed)</span>` : ""}</div>
    <div class="detail" id="detail"></div></div>`;
}

// ---- How we narrowed it down ----
if (steps.length && (bi || pr || cf)) {
  const total = steps.length;
  const tests = steps.filter(s => s.test).length;
  const prunedN = pr && pr.verified ? (pr.pruned || []).length : 0;
  const left = total - tests - prunedN;
  const searched = hintRight ? left : (bi && bi.edits) ?? left;
  const causes = cause ? 1 + ((rc.extra_causes || []).length) : null;
  const bisectRuns = (bi && bi.probes || []).length;
  const rows = [[total, "edits recorded in the session", ""]];
  if (tests) rows.push([total - tests, `set aside ${plural(tests, "edit")} to test files (tests stay as they are at HEAD)`, "cut"]);
  if (prunedN) rows.push([searched, `dropped ${plural(prunedN, "edit")} the test can't reach, checked with 1 run`, "cut"]);
  if (causes) rows.push([causes, hintRight ? `git blame's pick, checked directly` : `found by binary search in ${plural(bisectRuns, "test run")}`, "final"]);
  const secs = runs.reduce((a, r) => a + (r.duration_ms || 0), 0) / 1000;
  html += sec("How we narrowed it down", "From every edit in the session to the one that matters.");
  html += `<div class="panel"><div class="funnel">${rows.map(([v, t, c]) => `<div class="frow ${c}"><div><div class="bar" style="width:${Math.max(v / total * 100, 6)}%">${v}</div></div><div class="txt">${t}</div></div>`).join("")}</div>
    <div class="tiles">
      <div class="tile"><div class="v">${runs.length || D.runs_total || 0}</div><div class="k">test runs in total</div></div>
      <div class="tile"><div class="v">${secs ? secs.toFixed(1) + " s" : "–"}</div><div class="k">spent running tests</div></div>
      <div class="tile"><div class="v">${pre ? esc(pre.mode) : "–"}</div><div class="k">${pre && pre.mode === "flaky" ? `test fails ~${Math.round((pre.fail_rate || 0) * 100)}% of runs` : "the test fails every time"}</div></div>
    </div></div>`;
}

// ---- Lesson + reruns ----
if (ls || rr) {
  const vc = {VALIDATED: "PASS", PROMISING: "OTHER", NOT_NEEDED: "INFO", INEFFECTIVE: "TARGET_FAIL", INCONCLUSIVE: "OTHER"};
  const say = {
    VALIDATED: "The lesson works: with it, the agent stops making this mistake.",
    PROMISING: "Looks like it helps, but there weren't enough runs to be sure.",
    NOT_NEEDED: "The agent got it right even without the lesson.",
    INEFFECTIVE: "The lesson didn't change what the agent did.",
    INCONCLUSIVE: "Not enough valid runs to tell.",
  };
  const pips = a => a.map(o => `<span class="pip ${esc(o)}" title="${esc(o)}">${o === "PASS" ? "✓" : o === "TAMPERED" ? "T" : o === "REGRESSED" ? "R" : o === "OTHER" ? "?" : "✗"}</span>`).join("");
  const arm = (cls, k, a) => `<div class="arm ${cls}"><div class="k">${k}</div><div class="v">${valid(a) ? `${count(a)}/${valid(a)} <span class="small muted" style="font-weight:400">passed</span>` : "–"}</div><div class="pips">${pips(a)}</div></div>`;
  const hasRuns = rr && (rr.a.length || rr.b.length);
  html += sec("The lesson", "A rule for the agent, kept only if reruns prove it changes the outcome.");
  html += `<div class="panel">
    ${ls ? `<div class="label">${ls.source === "brain" ? "Reused from Entire Brain" : ls.source === "given" ? "Lesson (given with --lesson)" : "Proposed lesson"}</div><div class="lesson">“${esc(ls.text)}”</div>` : ""}
    ${rr ? (hasRuns ? `<div class="label">We reran ${esc(rr.agent || "an agent")} on the same task from just before the bad edit</div>
    <div class="ab">${arm("", "Without the lesson", rr.a)}<div class="arrow">→</div>${arm("with", "With the lesson", rr.b)}</div>` : `<div class="muted">Reruns didn't run (see notes).</div>`)
    + `<div class="verdict-row"><span class="chip ${vc[rr.verdict] || "INFO"}">${esc(rr.verdict)}</span><span class="say">${esc(say[rr.verdict] || "")}</span></div>
    <div class="foot">
      ${rr.p != null ? `<span class="mono">one-sided Fisher p = ${fmtP(rr.p)}</span>` : ""}
      <span>${rr.saved_to_brain ? "✓ saved to Entire Brain" : "not saved to Brain"}</span>
      ${rr.a.concat(rr.b).includes("OTHER") ? `<span>? = agent didn't really run (API error, quota), not counted</span>` : ""}
      ${rr.a.concat(rr.b).some(o => o === "TAMPERED" || o === "REGRESSED") ? `<span>T = edited the tests, R = broke another test; both count as failures</span>` : ""}
      ${rr.tokens ? `<span>${rr.tokens.toLocaleString()} tokens</span>` : ""}</div>
    ${hasRuns ? `<div class="foot">Both arms use the same rerun agent, so this shows the lesson helps ${esc(rr.agent || "that agent")}. Reruns start from a summary of earlier edits, not the original agent's memory.</div>` : ""}` : ""}
  </div>`;
}

if ((D.notes || []).length) html += `<div class="sec"><div><h2 style="font-size:16px">Notes</h2></div></div><div class="panel"><ul class="notes">${D.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`;

// ---- Technical details: the stage log and every run ----
const st = [];
const S = (n, name, state, msg) => st.push({n, name, state, msg});
S(0, "precheck", pre ? "done" : "todo", pre ? `HEAD fails ${pre.head_fail}/${pre.n}, good passes ${pre.good_pass}/${pre.n} → ${pre.mode}${pre.runs_per_state ? ` (fails ~${Math.round(pre.fail_rate * 100)}% of runs → ${pre.runs_per_state} runs per state, stopping at the first failure)` : ""}${pre.signature ? ` · signature <code>${esc(pre.signature)}</code>` : ""}` : "");
S(1, "commit", cm ? "done" : "todo", cm ? (cm.method === "blame" ? `blamed ${short(cm.sha)} ✓ confirmed (parent passes, commit fails)` : `${cm.blamed ? `blame hint ${short(cm.blamed)} wrong, ` : ""}bisected → ${short(cm.sha)}`) + (cm.checkpoint ? ` · checkpoint ${esc(cm.checkpoint)}` : "") + (cm.human ? " · no checkpoint, human-written" : "") : "");
const shellN = (ses && ses.shell_ids || []).length, unattrN = (ses && ses.unattributed_ids || []).length;
S(2, "session", ses ? (unattrN || (ses.replay_matches === false && !shellN) ? "warn" : "done") : "todo", ses ? `${esc(ses.id)} · ${steps.length} edits · replay ${ses.replay_matches ? "matches commit ✓" : `matches commit ✓ with ${[shellN ? `${shellN} edit${shellN > 1 ? "s" : ""} made by the agent's shell commands` : "", unattrN ? `${unattrN} unattributed edit${unattrN > 1 ? "s" : ""}` : ""].filter(Boolean).join(" and ") || "a leftover diff kept as an unattributed edit"}`}` : "");
S(3, "blame hint", bh ? "done" : "todo", bh ? `edit ${bh.step_ids.map(i => "#" + i).join(", ")} touches ${esc(bh.line)} → ${bh.is_cause ? "root cause ✓" : "NOT the cause (revert, still fails)"}` : ses ? (m.line ? `skipped (${esc(m.line)} wasn't written by this session)` : "skipped (no --line, and the traceback has no frame outside the tests)") : "");
S(4, "pruning", hintRight ? "todo" : pr ? (pr.verified === false ? "warn" : "done") : "todo",
  hintRight ? "skipped, the blame hint was right" :
  pr ? (!(pr.candidates || []).length ? "every edit is reachable from the test, nothing to prune" : pr.verified ? `pruned ${pr.pruned.length} edits (${pr.pruned.map(i => "#" + i).join(", ")}), verified in 1 run${pr.source ? ` · ${esc(pr.source)}` : ""}` : "pruning failed verification, dropped") : "");
S(5, "bisect", hintRight ? "todo" : bi ? "done" : "todo", hintRight ? `skipped, boundary checked directly: the test passes before edit #${rc ? rc.step_id : "?"} and fails after it (${(bi && bi.probes || []).length} runs)` : bi ? `${bi.edits ?? steps.filter(s => !s.test).length - (pr && pr.verified ? pr.pruned.length : 0)} edits → ${bi.probes.length} test runs → first failing prefix at edit #${bi.boundary}` : "");
S(6, "confirm", cf ? (cf.outcome === "PASS" ? "done" : "warn") : "todo", cf ? (cf.outcome === "PASS" ? `revert #${cf.step_id} from final → test passes ✓ root cause${cf.collateral && cf.collateral.length ? ` (collateral ${cf.collateral.map(i => "#" + i).join(", ")})` : ""}` : `revert #${cf.step_id} still fails → ddmin ${cf.ddmin ? "→ {" + cf.ddmin.join(", ") + "}" : "inconclusive"}`) : "");
S(7, "lesson", ls ? "done" : "todo", ls ? `${ls.source === "brain" ? "reused from Brain" : ls.source === "given" ? "given with --lesson" : "written by " + esc(ls.source || "Gemini")}` : "");
S(8, "reruns", rr ? "done" : "todo", rr ? `without lesson ${count(rr.a)}/${valid(rr.a)} · with lesson ${count(rr.b)}/${valid(rr.b)} · p = ${fmtP(rr.p)} → ${rr.verdict}` : "");

let tech = `<div class="panel"><div class="label">Pipeline stages</div><ul class="pipeline">${st.map(s => `<li class="${s.state}"><span class="dot ${s.state}"></span><span class="stage">${s.n} ${s.name}</span><span class="msg">${s.msg || "not reached"}</span></li>`).join("")}</ul></div>`;
if (runs.length) {
  const byStage = {};
  runs.forEach(r => byStage[r.stage] = (byStage[r.stage] || 0) + 1);
  const max = Math.max(...Object.values(byStage));
  tech += `<div class="panel"><div class="two"><div>
    <div class="label">Runs per stage</div><div class="bars">${Object.entries(byStage).map(([k, v]) => `<div class="hbar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v / max * 100}%"></div></div><span class="mono">${v}</span></div>`).join("")}</div></div>
    <div>${pr && pr.runs_without != null ? `<div class="label">Pruning savings (bisect runs)</div><div class="bars">
      <div class="hbar"><span>with pruning</span><div class="track"><div class="fill" style="width:${pr.runs_with / Math.max(pr.runs_with, pr.runs_without, 1) * 100}%"></div></div><span class="mono">${pr.runs_with}</span></div>
      <div class="hbar"><span>blind bisect${pr.runs_without_simulated ? " (simulated)" : ""}</span><div class="track"><div class="fill" style="width:${pr.runs_without / Math.max(pr.runs_with, pr.runs_without, 1) * 100}%;background:var(--muted)"></div></div><span class="mono">${pr.runs_without}</span></div></div>` : ""}</div></div>
    <details class="runs"><summary>All ${runs.length} runs</summary><table><thead><tr><th>#</th><th>Stage</th><th>State</th><th>Outcome</th><th style="text-align:right">ms</th></tr></thead><tbody>
    ${runs.map((r, i) => `<tr><td class="num">${i + 1}</td><td>${esc(r.stage)}</td><td class="mono">${esc(r.label)}</td><td>${chip(r.outcome)}</td><td class="num">${r.duration_ms ?? ""}</td></tr>`).join("")}
    </tbody></table></details></div>`;
}
if (rc && rc.failing_output) tech += `<div class="panel"><div class="label">Full failing test output at HEAD</div><pre class="trigger" style="max-height:360px">${esc(rc.failing_output)}</pre></div>`;
html += `<details class="tech"><summary>Technical details: every stage, every test run</summary><div class="stack">${tech}</div></details>`;

app.innerHTML = html;
// the error the agent reacted to is usually at the end of its tool output
document.querySelectorAll(".link pre").forEach(p => p.scrollTop = p.scrollHeight);

// ---- Edit detail (click a timeline cell) ----
function show(id) {
  const s = byId[id], el = document.getElementById("detail");
  if (!s || !el) return;
  document.querySelectorAll(".cell.sel").forEach(c => c.classList.remove("sel"));
  const c = document.querySelector(`.cell[data-id="${id}"]`); if (c) c.classList.add("sel");
  const tags = [];
  if (rc && s.id === rc.step_id) tags.push(chip("TARGET_FAIL", "root cause"));
  if (bh && bh.step_ids.includes(s.id)) tags.push(chip("OTHER", bh.is_cause ? "git blame's pick ✓" : "git blame's pick, not the cause"));
  if (pr && pr.verified && (pr.pruned || []).includes(s.id)) tags.push(chip("INFO", "can't affect the test"));
  if (s.test) tags.push(chip("INFO", "test file"));
  if (s.kind && s.kind !== "edit") tags.push(chip("INFO", s.kind + (((ses && ses.shell_guessed) || []).includes(s.id) ? " (command guessed)" : "")));
  el.innerHTML = `<div class="detail-head"><h3>Edit #${s.id} · <code>${esc(loc(s))}</code></h3>${tags.join("")}</div>
    ${s.reasoning || s.trigger ? `<div class="two">
      <div><div class="label">What the agent was reacting to</div>${s.trigger ? `<pre class="trigger">${esc(s.trigger)}</pre>` : `<div class="muted">No tool output right before this edit.</div>`}</div>
      <div><div class="label">Agent's reasoning</div>${s.reasoning ? `<div class="quote">${esc(s.reasoning)}</div>` : `<div class="muted">Not recorded (hidden thinking).</div>`}</div></div>` : `<div class="muted">No reasoning or trigger recorded for this edit.</div>`}
    ${s.command ? `<div><div class="label">Shell command that made this change</div><pre class="trigger">${esc(s.command)}</pre></div>` : ""}
    <div><div class="label">Diff</div><div class="diff">${diffLines(s.old_text, s.new_text)}</div></div>`;
}
document.querySelectorAll(".cell[data-id]").forEach(c => c.addEventListener("click", () => show(+c.dataset.id)));
// open on git blame's (wrong) pick when there is one: the hero already shows the cause
if (steps.length) show(bh && !bh.is_cause && bh.step_ids.length ? bh.step_ids[0] : rc ? rc.step_id : steps[0].id);
})();
</script>
</body>
</html>
